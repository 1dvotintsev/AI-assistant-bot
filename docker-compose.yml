services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: superadmin
      POSTGRES_PASSWORD: superadmin
      POSTGRES_DB: library
    ports:
      - "5438:5432"
    volumes:
      - library_bd_data:/var/lib/postgresql/data
      - ./sql/library/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: on-failure
    networks:
      - less_5_network
  bot:
    build: .
    command: python3 main.py
    restart: always
    depends_on:
      - db
volumes:
  library_bd_data:
networks:
  less_5_network:
      driver: bridge